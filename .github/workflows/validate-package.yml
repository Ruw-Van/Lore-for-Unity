name: Validate UPM metadata
on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  offline-metadata:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate package and pinned runtime metadata without network access to Lore
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        shell: pwsh
        run: |
          if ($env:REF_TYPE -eq 'tag') {
            python scripts/validate-package.py $env:REF_NAME
          } else {
            python scripts/validate-package.py
          }
      - name: Test offline validation failure cases
        run: python -m unittest discover -s scripts -p 'test_*.py'
